name: CI Test Gate & Automated AI Fix

on:
  pull_request:
    branches: [ main, staging ]

jobs:
  test-and-ai-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Test Suite
        id: run_tests
        run: npm test

      # 🤖 AUTOMATIC AI FAILURE ANALYSIS & PR FIX
      # This step triggers AUTOMATICALLY whenever `npm test` fails!
      - name: Trigger Automated AI Fix Suggestion on PR
        if: failure()
        uses: aws-actions/amazon-q-developer-action@v1
        with:
          prompt: "Analyze the Jest test failure log, identify the broken file and line number, and post a suggested code fix on this PR."
